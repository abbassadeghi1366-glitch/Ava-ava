name: Build Ava Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - '*.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Ava project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found in repository root."
            exit 1
          fi
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          test -f project/android/settings.gradle.kts

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          set -euo pipefail
          BUILD_FILE="project/android/app/build.gradle.kts"
          test -f "$BUILD_FILE"
          sed -i 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' "$BUILD_FILE"
          grep -n -A5 -B2 'compileOptions' "$BUILD_FILE"

      - name: Build debug APK
        run: |
          cd project/android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ava-debug-APK
          path: project/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
