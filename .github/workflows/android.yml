name: Build Ava Android APK with 3D wardrobe

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'tools/generate_ava_wardrobe.py'
      - '.github/workflows/android.yml'
      - 'woman-base-character.glb'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Generate skinned outfit GLBs
        run: |
          mkdir -p android/app/src/main/assets/wardrobe
          blender --background --python tools/generate_ava_wardrobe.py -- \
            --input woman-base-character.glb \
            --output android/app/src/main/assets/wardrobe
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon -Dandroid.useAndroidX=true -p android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ava-debug-APK-with-wardrobe
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload generated wardrobe GLBs
        uses: actions/upload-artifact@v4
        with:
          name: Ava-3D-Wardrobe-GLB
          path: android/app/src/main/assets/wardrobe/*.glb
          if-no-files-found: error
